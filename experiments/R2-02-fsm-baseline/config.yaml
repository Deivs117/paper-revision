# Run parameters for this experiment, kept out of scripts/ so a rerun is exact and diffable.
#
# Estos NO son parámetros de una corrida futura de scripts/ (no hay pipeline de regeneración desde
# cero) — documentan los parámetros reales usados por el equipo de simulación para producir lo que
# ya vive en data/, y los del lado "Neural" reutilizado desde otros experimentos ya existentes.

seed: 42
control_loop_hz: 6.67   # mismo timer 0.15s que red_neuronal.py / fsm_gait_arbitration.py

fsm_priority_rules:      # extraído literalmente de fsm_gait_arbitration.py (ver README.md § Data provenance)
  order: ["pitch>Upitch -> H (solo si ignore_imu_terrain=False)", "terrainchanger -> C",
          "G>0 -> X (persist 6s)", "R>0.5 -> C (persist 6s)", "B>0.5 -> H (persist 4s)", "default -> H"]
  Upitch_deg: 1
  persist_s: {X: 6.0, C: 6.0, H: 4.0}

families:
  # slug: [carpeta FSM en data/, carpeta Neural (fuente ya existente en el repo)]
  familia_a_apetitivo:
    fsm: familia_a_apetitivo_fsm
    neural: ../../simulation/familia_a_apetitivo
  familia_a_aversivo:
    fsm: familia_a_aversivo_fsm
    neural: ../../simulation/familia_a_aversivo
  familia_a_obstaculo:
    fsm: familia_a_obstaculo_fsm
    neural: ../../simulation/familia_a_obstaculo
  familia_b_compleja:
    fsm: familia_b_compleja_fsm
    neural: ../../simulation/familia_b_compleja
  familia_e_inspeccion:
    fsm: familia_e_inspeccion_fsm
    neural: ../../R3-05-inspection/data   # MISMO dataset ya publicado por la fila R3-05 — no duplicar

pending_families:   # sin datos FSM todavía — ver intake/pending/R2-02_fsm_baseline_reference.md §9
  familia_c1_terreno_rugoso:
    neural: ../../simulation/familia_c1_terreno_rugoso
    fsm: null
  familia_c2_pendiente:
    neural: ../../simulation/familia_c2_pendiente
    fsm: null
