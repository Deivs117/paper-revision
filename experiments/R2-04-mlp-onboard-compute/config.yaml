# Run parameters for this experiment, kept out of scripts/ so a rerun is exact and diffable.

checkpoint_json: ../../../pesos_red/parametros_modelo.json   # relative to scripts/, see README.md
input_size: 135
num_classes: 2
hidden_sizes: [150, 80]
activation: leaky_relu
negative_slope: 0.01

test_vectors:
  window_size: 15         # rows per window
  features_per_row: 9     # ax, ay, az, gx, gy, bit0, bit1, bit2, modo
  sources:
    - ../real/Test_current_integrated_floor_t01/imu_ina.csv
    - ../real/Test_current_integrated_ramp_t01/imu_ina.csv
  num_vectors: 5

benchmark:
  n_repeats: 1000
  board: esp32-s3-devkitc-1
  framework: arduino
