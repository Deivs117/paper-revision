# The real target: matches Peter_arduino/platformio.ini exactly (board + USB flags +
# flash config), the actual ESP32-S3 the physical robot's firmware runs on. The
# flash_size overrides are required: PlatformIO's esp32-s3-devkitc-1 board definition
# defaults to the 8MB "N8" variant, but the physical board on hand has 4MB -- without
# this override the binary's image header claims 8MB, the chip probes 4MB, and it
# bootloops forever on "Detected size(4096k) smaller than the size in the binary image
# header(8192k). Probe failed." (confirmed by connecting and reading the crash loop).
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.flash_frequency = 80m
board_build.partitions = default.csv
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_flags = -O2 -I../output -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

# Actual board connected (2026-08-29): identified by the OS as an ESP32-C3, not S3.
# Same Arduino-framework forward-pass code runs unchanged (RISC-V vs Xtensa is
# abstracted by the framework; nothing in main.cpp is S3-specific) -- only the
# board/target MCU differs. Generic Espressif devkit definition since the exact
# vendor board is unknown.
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
# ESP32-C3 only exposes a native USB port (no separate UART bridge chip) --
# Arduino's `Serial` defaults to the physical UART0 pins unless CDC-on-boot is
# explicitly enabled, in which case it's rerouted to the USB-Serial-JTAG
# peripheral that /dev/ttyACM0 actually is. Without this flag, setup()'s
# Serial.println() calls go nowhere reachable over this USB cable.
build_flags = -O2 -I../output -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
